# Copy visual settings to .streamlit/config.toml if you want to change them.
# Keep passwords and tokens in environment variables or Streamlit secrets, never here.

[theme]
base = "dark"
primaryColor = "#F59E0B"
backgroundColor = "#07151C"
secondaryBackgroundColor = "#0D222B"
textColor = "#F7FBFC"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true
maxUploadSize = 20
